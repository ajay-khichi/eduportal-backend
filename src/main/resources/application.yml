spring:
  application:
    name: backend
  profiles:
    active:
      - dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000
      refresh-token:
        expiration: 604800000

app:
  cors:
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  security:
    public-urls:
      - /auth/**
      - /v1/public/**

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


---
# ==========================================
# DEVELOPMENT ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

logging:
  level:
    root: INFO
    com.ignishers: DEBUG
    org.hibernate.sql: DEBUG
    org.springframework.security: INFO


---
# ==========================================
# PRODUCTION ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins:
      - https://attendx.ignishers.in

logging:
  level:
    root: WARN
    com.ignishers: INFO
    org.springframework.security: WARN